<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Portafolio de Camilo Gómez Forero, periodista.">
<title>El escritorio de Cami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Special+Elite&family=Karla:wght@400;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Press+Start+2P&display=swap">
<style>
/* Layout: the illustrated desk is the page. Each object opens its own kind of window: film viewer, browser, music player, arcade screen, press badge. */
:root{
  --paper:#f8e7d9;       /* matches the illustration's wall */
  --ink:#23292a;
  --ink-soft:#5d6463;
  --teal:#2f5759;
  --teal-deep:#1f3d3f;
  --lime:#d9e59a;        /* the laptop */
  --tie:#1f3f9e;         /* the tie */
  --tape:#f3d36b;
  --sheet:#fffdf9;
  --line:#e6dccd;
  --f-hand:"Caveat Brush","Comic Sans MS",cursive;
  --f-type:"Special Elite","Courier New",Courier,monospace;
  --f-body:"Karla","Helvetica Neue",Arial,sans-serif;
  --f-news:"Newsreader",Georgia,"Times New Roman",serif;
  --f-pixel:"Press Start 2P","Courier New",monospace;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink);margin:0}
img{max-width:100%}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit}

.top{max-width:1320px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:22px 4px;flex-wrap:wrap}
.who{display:flex;flex-direction:column;gap:2px}
.who h1{font-family:var(--f-type);font-weight:400;font-size:clamp(20px,2.6vw,30px);margin:0}
.who p{margin:0;color:var(--ink-soft);font-size:14px}
.sound{font-family:var(--f-type);font-size:14px;background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.sound[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--sheet)}
:focus-visible{outline:3px solid var(--tape);outline-offset:3px}

.stage{position:relative;max-width:1320px;margin:0 auto;aspect-ratio:2576/1438;width:100%;user-select:none;-webkit-user-select:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 91%,transparent 100%),linear-gradient(to right,transparent 0,#000 3%,#000 97%,transparent 100%);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to bottom,#000 91%,transparent 100%),linear-gradient(to right,transparent 0,#000 3%,#000 97%,transparent 100%);mask-composite:intersect}
.hit.globe img,.hit.phone img{filter:drop-shadow(0 8px 6px rgba(80,50,30,.25))}
.stage img{position:absolute;display:block;max-width:none;pointer-events:none}
.plate{inset:0;width:100%;height:100%}
.frame{opacity:0}.frame.on{opacity:1}

.hit{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hit img{position:absolute;inset:0;width:100%;height:100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1),filter .35s}
.hit:hover img,.hit:focus-visible img{transform:translateY(-4%) rotate(-3deg) scale(1.06);filter:drop-shadow(0 14px 8px rgba(70,50,30,.28))}
.hit.cube:hover img,.hit.cube:focus-visible img{transform:translateY(-8%) rotate(8deg) scale(1.05)}
.hit.phones:hover img,.hit.phones:focus-visible img{transform:translateY(-5%) rotate(2deg) scale(1.03)}
.tag{position:absolute;left:50%;bottom:100%;transform:translate(-50%,8px) rotate(-3deg);white-space:nowrap;font-family:var(--f-hand);font-size:clamp(15px,1.9vw,26px);color:var(--ink);background:var(--tape);padding:2px 12px 4px;box-shadow:0 2px 0 rgba(0,0,0,.12);opacity:0;transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:5}
.hit:hover .tag,.hit:focus-visible .tag{opacity:1;transform:translate(-50%,-4px) rotate(-3deg)}
.hit.cami .tag{bottom:auto;top:4%;left:86%;transform:translate(0,8px) rotate(2deg)}
.hit.cami:hover .tag,.hit.cami:focus-visible .tag{transform:translate(0,0) rotate(2deg)}
.hit.laptop .tag{bottom:auto;top:-2%;left:62%}
.dot{position:absolute;left:50%;top:40%;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--tape);display:none;animation:pulse 2s infinite}
@media (hover:none){.dot{display:block}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(243,211,107,.8)}70%{box-shadow:0 0 0 14px rgba(243,211,107,0)}100%{box-shadow:0 0 0 0 rgba(243,211,107,0)}}

.words{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.word{position:absolute;font-family:var(--f-type);font-size:clamp(9px,1.25vw,17px);color:var(--ink);white-space:nowrap;opacity:0;animation:rise 4.2s ease-out forwards}
.word.big{font-size:clamp(11px,1.6vw,22px);color:var(--teal-deep)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) rotate(var(--r))}12%{opacity:1}70%{opacity:.85}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-260%) rotate(calc(var(--r) * -1))}}

.hint{max-width:1320px;margin:6px auto 0;text-align:center;font-family:var(--f-hand);font-size:clamp(17px,2vw,22px);color:var(--ink-soft)}
.tabs{max-width:980px;margin:18px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tab{font-family:var(--f-type);font-size:15px;background:var(--sheet);color:var(--ink);border:1.5px solid var(--line);border-bottom:3px solid var(--teal);border-radius:6px 6px 2px 2px;padding:8px 16px;cursor:pointer;transition:transform .15s,border-color .15s}
.tab:hover{transform:translateY(-2px);border-color:var(--teal)}

/* ---------- windows ---------- */
dialog{border:0;padding:0;background:transparent;width:min(900px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 24px);overflow:visible}
dialog::backdrop{background:rgba(35,41,42,.5);backdrop-filter:blur(3px)}
dialog[open] .win{animation:pop .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.win{position:relative;max-height:calc(100dvh - 24px);overflow:auto;border-radius:12px;box-shadow:0 30px 70px rgba(20,15,10,.45)}
.x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;font-size:20px;line-height:1;z-index:3}

/* camera: film viewer */
.w-fotos{background:#141312;color:#efe9df;padding:0 0 18px}
.w-fotos .bar{display:flex;align-items:center;justify-content:space-between;padding:14px 56px 10px 20px;font-family:var(--f-type);font-size:14px;letter-spacing:.06em;color:#bfb6a8}
.w-fotos .bar b{font-weight:400;color:#f3d36b}
.w-fotos .x{background:#2b2926;color:#efe9df}
.viewer{position:relative;margin:0 20px;background:#000;border-radius:4px;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}
.viewer img{width:100%;height:100%;object-fit:contain;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(20,19,18,.7);color:#efe9df;font-size:24px;cursor:pointer}
.nav.prev{left:10px}.nav.next{right:10px}
.strip{margin:14px 0 0;background:#0c0b0a;padding:14px 20px;display:flex;gap:8px;overflow-x:auto;position:relative;
  background-image:radial-gradient(circle at 50% 50%,#2a2825 3px,transparent 3.5px),radial-gradient(circle at 50% 50%,#2a2825 3px,transparent 3.5px);
  background-size:18px 10px,18px 10px;background-position:0 2px,0 calc(100% - 2px);background-repeat:repeat-x}
.strip button{flex:0 0 auto;width:120px;aspect-ratio:16/9;padding:0;border:2px solid transparent;border-radius:2px;background:#000;cursor:pointer;opacity:.55;transition:opacity .2s,border-color .2s}
.strip button img{width:100%;height:100%;object-fit:cover;display:block}
.strip button[aria-current="true"]{opacity:1;border-color:#f3d36b}
.strip button:hover{opacity:.9}
.frameno{font-family:var(--f-type);font-size:12px;color:#8f877b;padding:8px 20px 0}

.modes{display:flex;gap:6px}.modes button{background:transparent;border:1px solid #3a3733;color:#bfb6a8;font-family:var(--f-type);font-size:13px;letter-spacing:.08em;padding:4px 10px;border-radius:3px;cursor:pointer}
.modes button[aria-selected="true"]{background:#f3d36b;border-color:#f3d36b;color:#141312}
.vid{padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vid .poster:first-child{grid-column:1/-1}
.poster.small .pbtn{width:52px;height:52px;margin:-26px;font-size:20px}
.poster.small .ptitle{font-size:clamp(15px,1.8vw,19px)}
.poster{position:relative;display:grid;align-content:end;gap:6px;aspect-ratio:16/9;border-radius:4px;padding:clamp(16px,3vw,28px);text-decoration:none;color:#fff;background:radial-gradient(circle at 70% 30%,var(--c) 0,color-mix(in srgb,var(--c) 35%,#120c0b) 45%,#120c0b 100%);overflow:hidden}
.pbtn{position:absolute;top:50%;left:50%;width:76px;height:76px;margin:-38px;border-radius:50%;background:#f3d36b;color:#141312;display:grid;place-items:center;font-size:28px;transition:transform .2s}
.poster:hover .pbtn{transform:scale(1.08)}
.ptitle{font-family:var(--f-news);font-weight:700;font-size:clamp(18px,2.8vw,28px);line-height:1.15;max-width:30ch;text-wrap:balance}
.psrc{font-size:13px;color:#e8c9c4}
/* phone */
dialog.d-phone{width:min(380px,calc(100vw - 24px))}
.w-redes{background:#111;border-radius:42px;padding:12px;box-shadow:0 30px 70px rgba(20,15,10,.5),inset 0 0 0 2px #444}
.w-redes .x{background:#111;color:#fff;top:22px;right:22px;width:30px;height:30px;font-size:16px}
.phonefr{background:#faf8f5;border-radius:32px;padding:12px 14px 20px;display:grid;gap:14px;max-height:calc(100dvh - 60px);overflow:auto}
.status{display:flex;justify-content:space-between;font-size:12px;font-weight:700;padding:2px 10px 0;color:#111}
.ph-h{margin:0;font-family:var(--f-hand);font-size:28px;padding:0 6px}
.post{display:grid;gap:6px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid #ece6dd;border-radius:14px;padding:10px 10px 12px}
.post-top{display:flex;align-items:center;gap:8px;font-size:13px}
.av{width:26px;height:26px;border-radius:50%;background-image:url(img/plate.webp);background-size:1100%;background-position:50% 25%;border:1.5px solid #e1306c}
.post-media{aspect-ratio:4/5;border-radius:8px;display:grid;place-items:center;font-size:44px;color:#fff}
.post-media.ig{background:linear-gradient(135deg,#f9ce34,#ee2a7b 50%,#6228d7)}
.post-media.yt{aspect-ratio:16/9;background:linear-gradient(135deg,#2b2b2b,#c4302b)}
.post-t{font-weight:700;font-size:16px}.post-p{font-size:14px;color:var(--ink-soft)}.post-cta{font-size:14px;font-weight:700;color:var(--teal)}
/* globe: postcard */
.w-viajes{background:#fbf3e4;border-radius:6px;padding:clamp(18px,3vw,30px);box-shadow:0 30px 70px rgba(20,15,10,.45);border:10px solid #fff}
.w-viajes .x{background:var(--ink);color:#fff}
.postal{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(16px,3vw,30px)}
.pl{border-right:2px dashed #d8c9ae;padding-right:clamp(16px,3vw,30px)}
.greet{font-family:var(--f-hand);font-size:24px;color:#b3261e;margin:0}
.w-viajes h2{font-family:var(--f-type);font-weight:400;font-size:clamp(22px,3.4vw,34px);margin:4px 0 12px;word-break:break-word}
.pp{margin:0 0 10px;color:var(--ink-soft)}.stop{font-family:var(--f-hand);font-size:22px;margin:0 0 18px}
.pr{display:grid;align-content:start;gap:18px;position:relative;padding-top:34px}
.stamp{justify-self:end;width:96px;height:116px;background:#2e8b57;color:#fff7d6;display:grid;place-content:center;text-align:center;font-family:var(--f-type);outline:4px dotted #fbf3e4;outline-offset:-4px;box-shadow:0 0 0 4px #2e8b57;transform:rotate(4deg)}
.stamp span{font-size:26px}.stamp small{font-size:11px;letter-spacing:.2em}
.addr{font-family:var(--f-hand);font-size:22px;line-height:1.5;margin:0;border-bottom:1.5px solid #d8c9ae;padding-bottom:6px}
.pmark{position:absolute;top:50px;right:80px;width:110px;height:110px;border:2.5px solid rgba(179,38,30,.5);border-radius:50%;display:grid;place-items:center;font-family:var(--f-type);font-size:12px;color:rgba(179,38,30,.7);transform:rotate(-14deg)}
@media (max-width:640px){.postal{grid-template-columns:1fr}.pl{border-right:0;border-bottom:2px dashed #d8c9ae;padding:0 0 16px}}
/* hoop */
.hit.hoop svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform-origin:50% 0;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.hit.hoop:hover svg,.hit.hoop:focus-visible svg{transform:rotate(-3deg)}
.hit.hoop:hover .net,.hit.hoop:focus-visible .net{animation:sway .6s ease-in-out 2}
@keyframes sway{50%{transform:translateX(4px)}}
.hit.hoop .tag{bottom:auto;top:100%;transform:translate(-50%,-4px) rotate(2deg)}
.hit.hoop:hover .tag,.hit.hoop:focus-visible .tag{transform:translate(-50%,6px) rotate(2deg)}
/* contact */
dialog.d-contact{width:min(560px,calc(100vw - 24px))}
.w-contacto{background:#f6efe2;padding:clamp(18px,4vw,28px);border-radius:14px}
.w-contacto .x{background:var(--ink);color:#fff}
.w-contacto h2{font-family:var(--f-hand);font-weight:400;font-size:clamp(30px,5vw,40px);margin:0 0 4px}
.w-contacto .lead{margin:0 0 16px;color:var(--ink-soft);font-size:15px}
.note{background:#fffdf6;border:1px solid #e3d8c3;border-radius:4px;padding:16px;display:grid;gap:12px;box-shadow:0 2px 0 #e3d8c3;background-image:repeating-linear-gradient(transparent 0 27px,#efe5d3 27px 28px);background-position:0 52px}
.note label{display:grid;gap:4px;font-family:var(--f-type);font-size:13px;color:var(--teal)}
.note input,.note textarea{font:16px var(--f-body);color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid #cdbfa5;padding:6px 2px;border-radius:0;width:100%}
.note textarea{min-height:96px;resize:vertical;border:1.5px solid #cdbfa5;border-radius:4px;padding:8px}
.note input:focus,.note textarea:focus{outline:none;border-color:var(--teal)}
.note .err{color:#b3261e;font-size:14px;margin:0;min-height:1.2em}
.throw-btn{justify-self:start;font-family:var(--f-type);font-size:16px;background:#e0662f;color:#fff;border:0;border-radius:999px;padding:11px 20px;cursor:pointer;box-shadow:0 3px 0 #a9461c}
.throw-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a9461c}
.court{position:relative;border-radius:8px;overflow:hidden;background:linear-gradient(#f3e3cc 0 78%,#d9a46a 78% 100%);touch-action:none;user-select:none}
.court canvas{display:block;width:100%;height:auto}
.court .msg{position:absolute;left:0;right:0;top:12px;text-align:center;font-family:var(--f-hand);font-size:24px;color:var(--ink);pointer-events:none}
.court .tries{position:absolute;left:12px;bottom:10px;font-family:var(--f-type);font-size:13px;color:#5b3b1c}
.done{text-align:center;padding:10px 0 4px}
.done .big{font-family:var(--f-hand);font-size:44px;color:#e0662f;margin:0}
.done p{margin:6px 0 0;color:var(--ink-soft)}
.inbox{margin-top:16px;border-top:1px dashed #cdbfa5;padding-top:12px}
.inbox summary{cursor:pointer;font-family:var(--f-type);font-size:14px;color:var(--teal)}
.inbox ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;max-height:240px;overflow:auto}
.inbox li{background:#fffdf6;border:1px solid #e3d8c3;border-radius:4px;padding:8px 10px;font-size:14px}
.inbox li b{display:block}.inbox li span{color:var(--ink-soft);font-size:12px}
.inbox li p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
/* laptop: browser */
.w-escritos{background:#f2f0ea;border:1px solid #d9d5c9}
.chrome{display:flex;align-items:center;gap:12px;padding:12px 56px 12px 16px;background:var(--lime);border-bottom:1px solid #c4d07f}
.lights{display:flex;gap:7px}.lights i{width:12px;height:12px;border-radius:50%;background:#e8705f}.lights i:nth-child(2){background:#e9b949}.lights i:nth-child(3){background:#70b85a}
.url{flex:1;min-width:0;background:#fffdf6;border-radius:8px;padding:6px 12px;font-size:13px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-escritos .x{background:transparent;color:var(--ink);top:6px}
.page{background:#fff;margin:0;padding:clamp(22px,5vw,56px);max-width:none}
.page .kick{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#b3261e}
.page h2{font-family:var(--f-news);font-weight:700;font-size:clamp(26px,4vw,42px);line-height:1.1;margin:10px 0 14px;max-width:24ch;text-wrap:balance}
.page .dek{font-family:var(--f-news);font-weight:500;font-size:clamp(17px,2vw,21px);line-height:1.45;color:#3a3a3a;max-width:58ch;margin:0 0 16px}
.page .by{font-size:14px;color:#666;margin:0 0 26px;border-top:1px solid #e5e2da;padding-top:12px}
.page .by b{color:var(--ink)}

/* headphones: player */
.w-audio{background:linear-gradient(160deg,#1c2232 0%,#121520 100%);color:#eef0f6;padding:clamp(20px,4vw,34px)}
.w-audio .x{background:rgba(255,255,255,.1);color:#eef0f6}
.player{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:clamp(18px,4vw,34px);align-items:center}
.cover{aspect-ratio:1;border-radius:8px;background:radial-gradient(circle at 30% 30%,#e6c35a,#b8462f 55%,#3b1717);display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.cover span{font-family:var(--f-type);font-size:clamp(28px,5vw,46px);color:#fff4dc;text-align:center;line-height:1;mix-blend-mode:screen;transform:rotate(-6deg)}
.vinyl{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;right:-30%;top:15%;background:repeating-radial-gradient(#111 0 2px,#1d1d1d 2px 4px);z-index:-1}
.w-audio .now{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9aa3bd;margin:0 0 8px}
.w-audio h2{font-family:var(--f-body);font-size:clamp(20px,2.8vw,28px);line-height:1.2;margin:0 0 6px;text-wrap:balance}
.w-audio .art{color:#aeb6cc;margin:0 0 18px;font-size:15px}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#f3d36b;transition:width .25s linear}
.times{display:flex;justify-content:space-between;font-size:12px;color:#9aa3bd;margin-top:6px;font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;gap:16px;margin:14px 0 18px}
.play{width:54px;height:54px;border-radius:50%;border:0;background:#f3d36b;color:#121520;font-size:20px;cursor:pointer}
.lyric{font-family:var(--f-news);font-size:clamp(17px,2.2vw,21px);line-height:1.4;color:#e6e9f2;border-left:3px solid #f3d36b;padding-left:14px;margin:0 0 20px;font-style:italic}
.lyric cite{display:block;font-style:normal;font-family:var(--f-body);font-size:13px;color:#9aa3bd;margin-top:6px}
.w-audio .meta{font-size:13px;color:#9aa3bd}

/* cube: arcade */
.w-juegos{background:#0d0f1a;color:#d8f7d0;padding:clamp(18px,3vw,28px);border:10px solid #2a2440;border-radius:18px}
.w-juegos .x{background:#2a2440;color:#d8f7d0}
.crt{position:relative;background:radial-gradient(ellipse at center,#122019 0%,#070a09 100%);border-radius:12px;padding:clamp(18px,4vw,36px);overflow:hidden}
.crt::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 2px,transparent 2px 4px);pointer-events:none}
.px{font-family:var(--f-pixel);line-height:1.6}
.crt .ins{font-size:clamp(9px,1.2vw,11px);color:#f3d36b;animation:blinkTxt 1.1s steps(1) infinite;margin:0 0 14px}
@keyframes blinkTxt{50%{opacity:0}}
.crt h2{font-size:clamp(13px,2vw,19px);color:#7cf29a;margin:0 0 6px;text-shadow:0 0 8px rgba(124,242,154,.6)}
.crt .sub{font-family:var(--f-body);font-size:15px;color:#b8d8bd;margin:0 0 20px;max-width:60ch}
.menu{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:4px}
.menu button{width:100%;text-align:left;background:transparent;border:0;color:#d8f7d0;font-family:var(--f-pixel);font-size:clamp(10px,1.5vw,13px);padding:8px 10px 8px 30px;cursor:pointer;position:relative;border-radius:3px}
.menu button[aria-selected="true"]{background:rgba(124,242,154,.12);color:#fff}
.menu button[aria-selected="true"]::before{content:"▶";position:absolute;left:8px;color:#f3d36b}
.menu .n{color:#6a8a72;margin-right:10px}
.desc{min-height:3.2em;font-family:var(--f-body);font-size:15px;color:#e7f5e9;border:2px solid #2e4a37;border-radius:4px;padding:10px 12px;margin:0 0 20px}
.go{display:inline-block;font-family:var(--f-pixel);font-size:clamp(10px,1.4vw,12px);color:#0d0f1a;background:#7cf29a;padding:12px 16px;text-decoration:none;border-radius:3px;box-shadow:0 4px 0 #3c8f55}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #3c8f55}
.credit{font-family:var(--f-body);font-size:13px;color:#7d9a84;margin:14px 0 0}

/* Cami: press badge */
dialog.d-badge{width:min(420px,calc(100vw - 24px))}
.w-sobre{background:var(--sheet);border-radius:16px;padding:0 0 22px;text-align:center}
.lanyard{height:44px;background:repeating-linear-gradient(90deg,var(--tie) 0 14px,#2b52c4 14px 28px);border-radius:16px 16px 0 0;position:relative}
.lanyard::after{content:"";position:absolute;left:50%;bottom:-10px;width:70px;height:20px;margin-left:-35px;background:#cfd3d8;border-radius:4px;box-shadow:inset 0 -3px 0 #aab0b7}
.w-sobre .x{background:rgba(255,255,255,.85);color:var(--ink)}
.press{font-family:var(--f-type);letter-spacing:.3em;font-size:13px;color:#b3261e;margin:26px 0 12px}
.avatar{width:120px;height:120px;border-radius:50%;margin:0 auto 12px;background-image:url(img/plate.webp);background-size:1100%;background-position:50% 25%;border:3px solid var(--ink)}
.w-sobre h2{font-family:var(--f-type);font-weight:400;font-size:24px;margin:0}
.w-sobre .role{color:var(--ink-soft);margin:2px 0 16px;font-size:15px}
.w-sobre dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;margin:0 26px;font-size:14px}
.w-sobre dt{font-family:var(--f-type);color:var(--teal)}
.w-sobre dd{margin:0}
.barcode{height:34px;margin:18px 26px 0;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px)}

.btn{display:inline-block;text-decoration:none;font-weight:700;border-radius:6px;padding:11px 18px}
.btn.dark{background:var(--ink);color:#fff}

@media (max-width:640px){
  .player{grid-template-columns:1fr}
  .cover{max-width:220px;margin:0 auto}
  .strip button{width:92px}
}
@media (prefers-reduced-motion:reduce){
  .hit img,.tag,.prog i{transition:none}
  dialog[open] .win{animation:none}
  .dot,.crt .ins{animation:none}
}
</style>

  <button class="hit globe" data-sec="viajes" data-box="2294,890,2546,1286" aria-label="Viajes"><img src="img/globe.webp" alt=""><span class="tag">Viajes</span><i class="dot"></i></button>

<script>
(function(){
/* Pega aquí tu endpoint de Formspree (https://formspree.io/f/xxxxxxx) para recibir los mensajes en tu correo */
const FORM_ENDPOINT='';
const W=2576,H=1438;
const POS={"arms":{"x":860,"y":860,"w":680,"h":290},"lid":{"x":1340,"y":690,"w":745,"h":610},"blink":{"x":1120,"y":360,"w":340,"h":150}};
const pct=(v,t)=>(v/t*100)+'%';
document.querySelectorAll('[data-pos]').forEach(el=>{const p=POS[el.dataset.pos];Object.assign(el.style,{left:pct(p.x,W),top:pct(p.y,H),width:pct(p.w,W),height:pct(p.h,H)});if(p.px!=null)el.style.transformOrigin=pct(p.px,p.w)+' '+pct(p.py,p.h)});
document.querySelectorAll('[data-box]').forEach(el=>{const [x0,y0,x1,y1]=el.dataset.box.split(',').map(Number);Object.assign(el.style,{left:pct(x0,W),top:pct(y0,H),width:pct(x1-x0,W),height:pct(y1-y0,H)})});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(matchMedia('(hover: none)').matches) document.getElementById('hint').textContent='Toca un objeto del escritorio para ver una muestra';

/* ---------- sound ---------- */
let ctx=null,soundOn=false;
const sBtn=document.getElementById('sound');
sBtn.addEventListener('click',()=>{
  soundOn=!soundOn;sBtn.setAttribute('aria-pressed',soundOn);sBtn.querySelector('span').textContent=soundOn?'Sonido encendido':'Sonido apagado';
  if(soundOn&&!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ctx&&ctx.state==='suspended')ctx.resume();
});
function clack(){
  if(!soundOn||!ctx)return;
  const t=ctx.currentTime,len=0.03,buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*len),ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);
  const s=ctx.createBufferSource();s.buffer=buf;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=3200+Math.random()*1200;f.Q.value=1.5;
  const g=ctx.createGain();g.gain.value=.22;s.connect(f).connect(g).connect(ctx.destination);s.start(t);
}

/* ---------- typing: forearms drop onto the keys, finished words float up from behind the screen ---------- */
const armsB=document.getElementById('armsB');
const fBlink=document.getElementById('fBlink');
const wordsBox=document.getElementById('words');
const phrases=['María Elvira Salazar','midterms','Venezuela','Queens of the Stone Age','migración','siete juegos','Rock al Parque','Mundo','Revista Vea','El Espectador','Bogotá','entrevista','crónica','conciertos','Florida','Trump','Brasil','Óscar'];
const LID={x0:1600,x1:2000,y0:725,y1:680};
let pi=Math.floor(Math.random()*phrases.length),ci=0;
function tap(){armsB.classList.toggle('on');clack();}
function floatWord(text){
  const t=Math.random();
  const x=LID.x0+(LID.x1-LID.x0)*(0.1+0.8*t), y=LID.y0+(LID.y1-LID.y0)*(0.1+0.8*t);
  const s=document.createElement('span');s.className='word'+(text.length>12?' big':'');s.textContent=text;
  s.style.left=pct(x,W);s.style.top=pct(y,H);
  s.style.setProperty('--r',((Math.random()*8)-4).toFixed(1)+'deg');
  s.style.setProperty('--dx',((Math.random()*80)-40).toFixed(0)+'%');
  wordsBox.appendChild(s);setTimeout(()=>s.remove(),4400);
}
function step(){
  const text=phrases[pi%phrases.length];
  if(ci<text.length){
    if(text[ci]!==' ')tap();
    ci++;
    setTimeout(step,120+Math.random()*90+(text[ci-1]===' '?90:0));
  }else{
    floatWord(text);pi++;ci=0;armsB.classList.remove('on');
    setTimeout(step,700+Math.random()*900);
  }
}
if(reduce){
  ['Venezuela','midterms','Rock al Parque'].forEach((w,i)=>{const s=document.createElement('span');s.className='word';s.style.animation='none';s.style.opacity='.8';s.textContent=w;s.style.left=pct(1700+i*120,W);s.style.top=pct(560+i*60,H);wordsBox.appendChild(s)});
}else{
  setTimeout(step,900);
  (function blink(){setTimeout(()=>{fBlink.classList.add('on');setTimeout(()=>{fBlink.classList.remove('on');if(Math.random()<.2){setTimeout(()=>{fBlink.classList.add('on');setTimeout(()=>fBlink.classList.remove('on'),110)},160)}blink()},130)},2800+Math.random()*3500)})();
}

/* ---------- content ---------- */
const DATA={
  escritos:{kick:'Mundo · América',title:'De la Espriella y Machado, en la campaña de María Elvira Salazar: ¿error de cálculo?',
    dek:'La han llamado “la mejor amiga de Colombia” y una “aliada leal de Venezuela”. Sin embargo, la congresista estadounidense María Elvira Salazar ha tomado decisiones que perjudican a la comunidad de estos dos países en Florida. ¿Por qué la apoyan si, además, no tendría efecto?',
    date:'16 de octubre de 2026',url:'https://www.elespectador.com/mundo/america/de-la-espriella-y-machado-en-la-campana-de-maria-elvira-salazar/'},
  audio:{title:'Queens of the Stone Age, la banda que defiende la imperfección en tiempos de IA',
    dek:'En conversación con El Espectador, Jon Theodore, baterista de Queens of the Stone Age, habló de ‘Perfecth’, el disco que lanzó la banda, y de su regreso a Latinoamérica.',
    quote:'La diferencia en cómo se hace la música se siente en el cuerpo, en un nivel sutil.',quoteBy:'Jon Theodore',
    date:'3 de noviembre de 2026',url:'https://www.elespectador.com/revista-vea/musica-y-conciertos/entrevista-queens-of-the-stone-age-la-banda-que-defiende-la-imperfeccion-en-tiempos-de-ia/'},
  interactivos:{games:[
      ['Midterms: 7 juegos','Las elecciones de EE. UU. y la era Trump, explicadas con juegos: derrota centros de datos, esquiva titulares de corrupción y lidia con el precio de la carne. Diseño de Viviana Velásquez.','https://www.elespectador.com/mundo/america/elecciones-midterm-de-ee-uu-y-la-era-trump-explicadas-con-juegos/','3 nov. 2026'],
      ['Mapa en vivo','Cubrimiento en vivo de las midterms con gráficos en Flourish: cada punto es un escaño y cambia de color cuando se proyecta un ganador.','https://www.elespectador.com/mundo/elecciones-en-ee-uu-hoy-en-vivo-trump-congreso/','3 nov. 2026'],
      ['Núremberg en 3D','El experimento que falló: por qué Núremberg no logró frenar los crímenes del siglo XXI. Espacios digitales diseñados con Metasteps y Meshy.','https://www.elespectador.com/mundo/europa/juicios-de-nuremberg-a-los-nazis-80-anos-despues-que-legado-queda/','22 nov. 2025']]},
  video:[{title:'¿Cómo funcionan las votaciones en Estados Unidos? Entienda todo en cinco minutos',url:'https://www.youtube.com/watch?v=5hGaq-ksXfI&t=106s',c:'#c0392b'},
    {title:'Incendios en Los Ángeles',url:'https://www.youtube.com/watch?v=v3MKBBvimWw&t=13s',c:'#d9822b'},
    {title:'Asalto al Capitolio',url:'https://www.youtube.com/watch?v=rTn-gfw0PPE&t=3s',c:'#3d5a9e'}],
  redes:[{kind:'Instagram',title:'Manejo de redes sociales',p:'Una publicación hecha para Instagram.',url:'https://www.instagram.com/p/DfU1g-EFteb/',cta:'Ver en Instagram'},
         {kind:'YouTube',title:'Formatos en video',p:'Video pensado para redes.',url:'https://www.youtube.com/watch?v=8wtyEEJlJd8&t=103s',cta:'Ver en YouTube'}],
  viajes:{name:'camisymarisxelmundo',p:'Un blog de viajes de Cami y Mari: lugares favoritos, itinerarios y mapas.',stop:'Primera parada: Río de Janeiro',url:'https://camisymarisxelmundo.substack.com/'},
  fotos:{n:9}
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dlg=document.getElementById('dlg');
let cleanup=null;
const X=(cls='')=>`<button class="x ${cls}" type="button" aria-label="Cerrar">×</button>`;

const VIEWS={
  fotos(){
    const n=DATA.fotos.n;
    const vids=DATA.video;
    dlg.innerHTML=`<div class="win w-fotos">${X()}<div class="bar"><span class="modes" role="tablist"><button type="button" role="tab" aria-selected="true" data-m="f">FOTOS</button><button type="button" role="tab" aria-selected="false" data-m="v">VIDEO</button></span><span id="fc">01 / ${String(n).padStart(2,'0')}</span></div>
      <div class="vid" hidden>${vids.map((v,i)=>`<a class="poster${i?' small':''}" style="--c:${v.c}" href="${esc(v.url)}" target="_blank" rel="noopener"><span class="pbtn" aria-hidden="true">▶</span><span class="ptitle">${esc(v.title)}</span><span class="psrc">El Espectador · YouTube</span></a>`).join('')}</div>
      <div class="fotos-pane">
      <div class="viewer"><img id="big" src="fotos/f1.webp" alt="Fotografía de concierto 1"><button class="nav prev" type="button" aria-label="Foto anterior">‹</button><button class="nav next" type="button" aria-label="Foto siguiente">›</button></div>
      <div class="strip" role="list">${Array.from({length:n},(_,i)=>`<button type="button" role="listitem" data-i="${i}" aria-label="Foto ${i+1}" ${i?'':'aria-current="true"'}><img src="fotos/f${i+1}.webp" alt="" loading="lazy"></button>`).join('')}</div>
      <p class="frameno">Haz clic en un fotograma o usa las flechas del teclado.</p></div></div>`;
    const modes=[...dlg.querySelectorAll('.modes button')],fp=dlg.querySelector('.fotos-pane'),vp=dlg.querySelector('.vid'),fcEl=dlg.querySelector('#fc');
    modes.forEach(b=>b.addEventListener('click',()=>{const vid=b.dataset.m==='v';modes.forEach(m=>m.setAttribute('aria-selected',m===b));fp.hidden=vid;vp.hidden=!vid;fcEl.style.visibility=vid?'hidden':'visible'}));
    let cur=0;const big=dlg.querySelector('#big'),fc=dlg.querySelector('#fc'),thumbs=[...dlg.querySelectorAll('.strip button')];
    const show=i=>{cur=(i+n)%n;big.src=`fotos/f${cur+1}.webp`;big.alt=`Fotografía de concierto ${cur+1}`;fc.textContent=`${String(cur+1).padStart(2,'0')} / ${String(n).padStart(2,'0')}`;thumbs.forEach((t,j)=>t.setAttribute('aria-current',j===cur));thumbs[cur].scrollIntoView({block:'nearest',inline:'nearest',behavior:reduce?'auto':'smooth'});};
    thumbs.forEach(t=>t.addEventListener('click',()=>show(+t.dataset.i)));
    dlg.querySelector('.prev').addEventListener('click',()=>show(cur-1));
    dlg.querySelector('.next').addEventListener('click',()=>show(cur+1));
    const key=e=>{if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)};
    dlg.addEventListener('keydown',key);cleanup=()=>dlg.removeEventListener('keydown',key);
  },
  escritos(){
    const d=DATA.escritos;
    dlg.innerHTML=`<div class="win w-escritos"><div class="chrome"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span><span class="url">${esc(d.url.replace('https://',''))}</span></div>${X()}
      <article class="page"><span class="kick">${esc(d.kick)}</span><h2>${esc(d.title)}</h2><p class="dek">${esc(d.dek)}</p>
      <p class="by">Por <b>Camilo Gómez Forero</b> · El Espectador · ${esc(d.date)}</p>
      <a class="btn dark" href="${esc(d.url)}" target="_blank" rel="noopener">Leer el artículo completo →</a></article></div>`;
  },
  audio(){
    const d=DATA.audio;
    dlg.innerHTML=`<div class="win w-audio">${X()}<div class="player">
      <div class="cover" aria-hidden="true"><div class="vinyl"></div><span>QOTSA</span></div>
      <div><p class="now">Entrevista · Revista Vea</p><h2>${esc(d.title)}</h2><p class="art">Camilo Gómez Forero con Jon Theodore</p>
      <div class="prog"><i id="pbar"></i></div><div class="times"><span id="t0">0:00</span><span>3:59</span></div>
      <div class="ctrl"><button class="play" id="play" type="button" aria-label="Reproducir">▶</button><a class="btn" style="color:#f3d36b;padding:0" href="${esc(d.url)}" target="_blank" rel="noopener">Leer la entrevista →</a></div>
      <blockquote class="lyric">“${esc(d.quote)}”<cite>${esc(d.quoteBy)}</cite></blockquote>
      <p class="meta">${esc(d.dek)}</p></div></div></div>`;
    let t=0,timer=null;const bar=dlg.querySelector('#pbar'),t0=dlg.querySelector('#t0'),pl=dlg.querySelector('#play'),TOT=239;
    const tick=()=>{t=(t+1)%TOT;bar.style.width=(t/TOT*100)+'%';t0.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
    pl.addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null;pl.textContent='▶';pl.setAttribute('aria-label','Reproducir')}else{timer=setInterval(tick,250);pl.textContent='❚❚';pl.setAttribute('aria-label','Pausar')}});
    cleanup=()=>{if(timer)clearInterval(timer)};
  },
  interactivos(){
    const d=DATA.interactivos.games;
    dlg.innerHTML=`<div class="win w-juegos">${X()}<div class="crt"><p class="px ins">INSERT COIN</p><h2 class="px">INTERACTIVOS</h2><p class="sub">Juegos, mapas en vivo y espacios en 3D. Elige uno.</p>
      <ul class="menu" role="listbox" aria-label="Interactivos">${d.map((g,i)=>`<li><button type="button" role="option" data-i="${i}" aria-selected="${i===0}"><span class="n">${i+1}</span>${esc(g[0].toUpperCase())}</button></li>`).join('')}</ul>
      <p class="desc" id="gdesc" aria-live="polite"></p>
      <a class="go" id="go" href="#" target="_blank" rel="noopener">▶ PRESS START</a>
      <p class="credit" id="gdate"></p></div></div>`;
    const opts=[...dlg.querySelectorAll('.menu button')],desc=dlg.querySelector('#gdesc'),go=dlg.querySelector('#go'),gd=dlg.querySelector('#gdate');let cur=0;
    const sel=i=>{cur=(i+opts.length)%opts.length;opts.forEach((o,j)=>o.setAttribute('aria-selected',j===cur));desc.textContent=d[cur][1];go.href=d[cur][2];gd.textContent='El Espectador · '+d[cur][3];};
    sel(0);
    opts.forEach(o=>{o.addEventListener('click',()=>sel(+o.dataset.i));o.addEventListener('mouseenter',()=>sel(+o.dataset.i));o.addEventListener('focus',()=>sel(+o.dataset.i))});
    const key=e=>{if(e.key==='ArrowDown'){e.preventDefault();sel(cur+1);opts[cur].focus()}if(e.key==='ArrowUp'){e.preventDefault();sel(cur-1);opts[cur].focus()}};
    dlg.addEventListener('keydown',key);cleanup=()=>dlg.removeEventListener('keydown',key);
  },
  redes(){
    dlg.innerHTML=`<div class="win w-redes">${X()}<div class="phonefr"><div class="status"><span>9:41</span><span>● ● ●</span></div><p class="ph-h">Redes y video</p>

      <form class="note" id="cform" novalidate>

        <label for="c-mail">Tu correo<input id="c-mail" name="correo" type="email" autocomplete="email" maxlength="120"></label>

    const form=dlg.querySelector('#cform'),err=dlg.querySelector('#cerr'),court=dlg.querySelector('#court'),done=dlg.querySelector('#cdone');

      unsubInbox=db.collection('mensajes').onSnapshot(snap=>{

      },()=>{});
    }catch(e){}})();
    form.addEventListener('submit',e=>{
      e.preventDefault();
      const nombre=form.nombre.value.trim(),correo=form.correo.value.trim(),texto=form.texto.value.trim();
      if(!texto){err.textContent='Escribe un mensaje antes de lanzar.';form.texto.focus();return}
      if(correo&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)){err.textContent='Revisa el correo, parece que le falta algo.';form.correo.focus();return}
      err.textContent='';payload={nombre,correo,texto};form.hidden=true;court.hidden=false;stopGame=startGame(court,send);

    async function send(){

          if(!r.ok)throw new Error('form');
          txt.textContent='Tu mensaje llegó. Te respondo pronto.';court.hidden=true;done.hidden=false;return;

        lista.push({...payload,at:new Date().toISOString()});

      }catch(e){
        txt.textContent='Encestaste, pero desde aquí no puedo recibir el mensaje. Escríbeme a camilogomez721@gmail.com o en redes: @camilogomez8';

function startGame(court,onScore){
  const cv=court.querySelector('canvas'),c=cv.getContext('2d'),msg=court.querySelector('#cmsg'),tries=court.querySelector('#ctries');
  const W=cv.width,H=cv.height,G=2600,R_=30,FLOOR=H*0.78+40;
  const rimF={x:W-250,y:300},rimB={x:W-110,y:300},board={x:W-92,y0:150,y1:330};
  const start={x:150,y:FLOOR-R_-60};
  let ball={x:start.x,y:start.y,vx:0,vy:0,rot:0},state='aim',drag=null,misses=0,netT=0,scored=false,raf=0,last=0,attemptT=0;
  const scale=()=>cv.getBoundingClientRect().width/W;
  const toCv=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
  function reset(){ball={x:start.x,y:start.y,vx:0,vy:0,rot:0};state='aim';scored=false;
    msg.textContent=misses>=3?'Te ayudo con este…':misses?'¡Casi! Otra vez':'Arrastra el balón hacia atrás y suéltalo';
    tries.textContent=misses?'Intentos: '+misses:'';
    if(misses>=3)setTimeout(assist,700);}
  function launch(vx,vy){ball.vx=vx;ball.vy=vy;state='fly';attemptT=0;msg.textContent='';}
  function assist(){const T=0.95,tx=(rimF.x+rimB.x)/2,ty=rimF.y-8;launch((tx-ball.x)/T,(ty-ball.y-0.5*G*T*T)/T);}
  cv.addEventListener('pointerdown',e=>{if(state!=='aim'||misses>=3)return;const p=toCv(e);if(Math.hypot(p.x-ball.x,p.y-ball.y)<R_*3){drag={x:p.x,y:p.y};cv.setPointerCapture(e.pointerId)}});
  cv.addEventListener('pointermove',e=>{if(!drag)return;const p=toCv(e);drag.x=p.x;drag.y=p.y});
  cv.addEventListener('pointerup',()=>{if(!drag)return;let dx=start.x-drag.x,dy=start.y-drag.y;const L=Math.hypot(dx,dy),M=260;if(L<15){drag=null;return}if(L>M){dx*=M/L;dy*=M/L}drag=null;launch(dx*7.2,dy*7.2)});
  cv.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&state==='aim'){e.preventDefault();assist()}});
  cv.tabIndex=0;
  function collidePoint(pt){const dx=ball.x-pt.x,dy=ball.y-pt.y,d=Math.hypot(dx,dy),min=R_+6;if(d<min&&d>0){const nx=dx/d,ny=dy/d,vn=ball.vx*nx+ball.vy*ny;if(vn<0){ball.vx-=1.6*vn*nx;ball.vy-=1.6*vn*ny;ball.vx*=.85;ball.vy*=.85;bounce()}ball.x=pt.x+nx*min;ball.y=pt.y+ny*min}}
  function step(dt){
    if(state==='aim'){if(drag){ball.x=start.x+Math.max(-200,Math.min(200,drag.x-start.x))*.35;ball.y=start.y+Math.max(-200,Math.min(200,drag.y-start.y))*.35}else{ball.x=start.x;ball.y=start.y}return}
    attemptT+=dt;const py=ball.y;
    ball.vy+=G*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.rot+=ball.vx*dt*.02;
    collidePoint(rimF);collidePoint(rimB);
    if(ball.x+R_>board.x&&ball.y>board.y0&&ball.y<board.y1&&ball.vx>0){ball.x=board.x-R_;ball.vx=-ball.vx*.6;bounce()}
    if(!scored&&py<rimF.y&&ball.y>=rimF.y&&ball.vy>0&&ball.x>rimF.x+8&&ball.x<rimB.x-8){scored=true;netT=1;swish();msg.textContent='¡Swish!';setTimeout(()=>{stop();onScore()},1100)}
    if(ball.y+R_>FLOOR){ball.y=FLOOR-R_;ball.vy=-ball.vy*.45;ball.vx*=.7;if(Math.abs(ball.vy)>120)bounce()}
    if(!scored&&(attemptT>3||ball.x<-80||ball.x>W+80||(ball.y+R_>=FLOOR-1&&Math.abs(ball.vy)<60&&attemptT>.6))){misses++;state='wait';setTimeout(reset,500)}
  }
  function drawBall(){c.save();c.translate(ball.x,ball.y);c.rotate(ball.rot);c.fillStyle='#e0662f';c.strokeStyle='#2a1f1a';c.lineWidth=5;c.beginPath();c.arc(0,0,R_,0,7);c.fill();c.stroke();c.lineWidth=3.5;c.beginPath();c.moveTo(-R_,0);c.lineTo(R_,0);c.moveTo(0,-R_);c.lineTo(0,R_);c.stroke();c.beginPath();c.arc(-R_*1.25,0,R_*.95,-.9,.9);c.stroke();c.beginPath();c.arc(R_*1.25,0,R_*.95,Math.PI-.9,Math.PI+.9);c.stroke();
    c.fillStyle='#fffdf6';c.globalAlpha=.9;c.fillRect(-R_*.55,-6,R_*1.1,12);c.globalAlpha=1;c.restore()}
  function draw(t){
    c.clearRect(0,0,W,H);
    // backboard + pole
    c.lineWidth=6;c.strokeStyle='#2a1f1a';c.fillStyle='#b9b2a6';c.fillRect(board.x+6,board.y0+60,26,H);c.strokeRect(board.x+6,board.y0+60,26,H);
    c.fillStyle='#fbf7ef';c.fillRect(board.x-6,board.y0,18,board.y1-board.y0);c.strokeRect(board.x-6,board.y0,18,board.y1-board.y0);
    // net
    const sw=netT>0?Math.sin(t/40)*12*netT:0;c.lineWidth=3.5;c.strokeStyle='#fffdf6';
    for(let i=0;i<=5;i++){const x0=rimF.x+i*(rimB.x-rimF.x)/5,x1=rimF.x+25+i*(rimB.x-rimF.x-50)/5+sw;c.beginPath();c.moveTo(x0,rimF.y);c.lineTo(x1,rimF.y+110);c.stroke()}
    for(let j=1;j<=3;j++){const y=rimF.y+j*35,k=j/3*25;c.beginPath();c.moveTo(rimF.x+k+sw*j/3,y);c.lineTo(rimB.x-k+sw*j/3,y);c.stroke()}
    c.strokeStyle='#2a1f1a';c.lineWidth=1.5;
    // ball (behind rim front when below)
    if(state!=='aim'&&!scored&&ball.y<rimF.y)drawBall();
    // rim
    c.lineWidth=12;c.strokeStyle='#e0662f';c.beginPath();c.moveTo(rimF.x,rimF.y);c.lineTo(board.x-6,rimF.y);c.stroke();
    c.lineWidth=4;c.strokeStyle='#2a1f1a';c.beginPath();c.moveTo(rimF.x,rimF.y+7);c.lineTo(board.x-6,rimF.y+7);c.stroke();
    if(state==='aim'||scored||ball.y>=rimF.y)drawBall();
    // aim guide
    if(drag){let dx=start.x-drag.x,dy=start.y-drag.y;const L=Math.hypot(dx,dy),M=260;if(L>M){dx*=M/L;dy*=M/L}let vx=dx*7.2,vy=dy*7.2,x=start.x,y=start.y;c.fillStyle='rgba(42,31,26,.45)';for(let i=0;i<10;i++){for(let k=0;k<4;k++){vy+=G*.012;x+=vx*.012;y+=vy*.012}c.beginPath();c.arc(x,y,6-i*.4,0,7);c.fill()}}
    netT=Math.max(0,netT-.012);
  }
  function loop(t){const dt=Math.min(.033,(t-(last||t))/1000);last=t;step(dt);draw(t);raf=requestAnimationFrame(loop)}
  function stop(){cancelAnimationFrame(raf)}
  reset();raf=requestAnimationFrame(loop);cv.focus({preventScroll:true});
  return stop;
}
function tone(type){if(!soundOn||!ctx)return;const t=ctx.currentTime;
  if(type==='swish'){const len=.45,buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*len),ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/d.length);const s=ctx.createBufferSource();s.buffer=buf;const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=2500;const g=ctx.createGain();g.gain.value=.3;s.connect(f).connect(g).connect(ctx.destination);s.start(t)}
  else{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(60,t+.15);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.22)}}
function swish(){tone('swish')}
function bounce(){tone('bounce')}
function open(id){
  if(!VIEWS[id])return;
  if(cleanup){cleanup();cleanup=null}
  dlg.className=id==='sobre-mi'?'d-badge':id==='redes'?'d-phone':id==='contacto'?'d-contact':'';
  dlg.setAttribute('aria-label',{contacto:'Contacto',escritos:'Escritos',fotos:'Fotos y video',audio:'Audio',interactivos:'Interactivos',redes:'Redes',viajes:'Viajes','sobre-mi':'Sobre mí'}[id]);
  VIEWS[id]();
  dlg.querySelector('.x').addEventListener('click',()=>dlg.close());
  if(!dlg.open)dlg.showModal();
  if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);
}
dlg.addEventListener('close',()=>{if(cleanup){cleanup();cleanup=null}if(location.hash)history.replaceState(null,'',location.pathname+location.search)});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
document.querySelectorAll('[data-sec]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.sec)));
function fromHash(){const id=location.hash.slice(1);if(VIEWS[id])open(id)}
addEventListener('hashchange',fromHash);fromHash();
})();
</script>
